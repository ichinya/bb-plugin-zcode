name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # Runtime source is built separately; npm has no ACP dependency.
      - name: Check out Rust ACP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ichinya/zcode-acp
          ref: v0.3.2
          path: .ci-zcode-acp
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo build --release --locked
        working-directory: .ci-zcode-acp
      - name: Select the built native executable
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          echo "ZCODE_ACP_BIN=$GITHUB_WORKSPACE/.ci-zcode-acp/target/release/zcode-acp$suffix" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      # The ACP ACL helper uses Windows PowerShell 5.1. Match its module search
      # environment; inheriting pwsh 7's PSModulePath breaks Set-Acl on runners.
      - name: Verify (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: npm run verify
      - name: Verify (Linux and macOS)
        if: runner.os != 'Windows'
        run: npm run verify

  tag:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Tag verified main version (never move an existing tag)
        run: node scripts/auto-tag.mjs
        env:
          GH_TOKEN: ${{ github.token }}
